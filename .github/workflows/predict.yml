name: Predict & Deploy to Vercel

on:
  schedule:
    # Monday 07:00 UTC — data refresh + predictions (start of matchweek)
    - cron: "0 7 * * 1"
    # Tuesday 07:00 UTC — midweek fixtures
    - cron: "0 7 * * 2"
    # Friday 07:00 UTC — weekend predictions
    - cron: "0 7 * * 5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest match history
        run: python -m src.data.ingest_match_history

      - name: Ingest Understat xG
      # Last-known-good dataset: restored before ingest so that if football-data.co.uk is
      # down (503s on 2026-09-07/08 killed two runs) we still have a matches.parquet to
      # predict from. Saved again below only after a successful fresh build.
      - name: Restore last-known-good dataset
        id: lkg
        uses: actions/cache/restore@v4
        with:
          path: data/processed/matches.parquet
          key: matches-parquet-${{ github.run_id }}
          restore-keys: |
            matches-parquet-

        run: python -m src.data.ingest_understat
        id: ingest
        continue-on-error: true

      - name: Build dataset
        run: python -m src.data.build_dataset
        id: understat
        if: steps.ingest.outcome == 'success'
        continue-on-error: true

      - name: Generate predictions (live with demo fallback)
        run: |
        id: build
        if: steps.ingest.outcome == 'success' && steps.understat.outcome == 'success'
        continue-on-error: true
          set +e
          # Try live mode first
      - name: Verify dataset (fall back to last-known-good)
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "Fresh dataset built."
          elif [ -f data/processed/matches.parquet ]; then
            echo "::warning::Data ingest/build failed (ingest=${{ steps.ingest.outcome }}, understat=${{ steps.understat.outcome }}, build=${{ steps.build.outcome }}) — predicting from last-known-good matches.parquet (cache key: ${{ steps.lkg.outputs.cache-matched-key }})"
          else
            echo "::error::Data ingest/build failed and no last-known-good matches.parquet is cached. Cannot predict."
            exit 1
          fi

      - name: Save dataset as last-known-good
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/processed/matches.parquet
          key: matches-parquet-${{ github.run_id }}

          python -m src.predict.predict_fixtures --html 2>&1
          EXIT_CODE=$?

          # Check if any HTML was produced (live mode succeeds but may find 0 fixtures)
          HTML_COUNT=$(find output -name "predictions_*.html" 2>/dev/null | wc -l)

          if [ "$HTML_COUNT" -eq 0 ]; then
            echo "::notice::No live fixtures found — falling back to demo date 2026-05-24"
            python -m src.predict.predict_fixtures --html --as-of 2026-05-24
          fi

      - name: Prepare Vercel prebuilt output
        run: |
          LATEST=$(ls -t output/predictions_*.html 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No predictions HTML found"
            exit 1
          fi
          mkdir -p .vercel/output/static
          cp "$LATEST" .vercel/output/static/index.html
          echo '{"version":3}' > .vercel/output/config.json
          echo "Deploying: $LATEST"

      - name: Deploy to Vercel
        run: |
          npm i -g vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
